<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
     rel="stylesheet" 
     integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" 
     crossorigin="anonymous">
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>HTML5 Form</title>
</head>
<body>
    <div class="whole d-flex">
    <div class="d-flex w-100">
        <div class="card m-auto w-75">
            <div class="card-header d-flex p-auto">
                <h2>Payment form example</h2>
            </div>
            <div class="card-body">
                <div class="alert alert-danger">
                    Some fields are missing
                  </div>
        <fieldset>
                <div class="row g-3 pb-3">
                    <div class="col-md-6">
                        <label for="card#" class=" form-label fs-6">Card #</label>
                        <input type="number" id="card#" placeholder="xxxxxxxxxxxx" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label for="cvc" class="form-label fs-6">CVC #</label>
                        <input type="number" id="cvc" placeholder="0000" class="form-control" maxlength="4">
                    </div>
                    <div class="col-md-3">
                        <label for="amount" class="form-label fs-6">Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                        <input type="number" id="amount" placeholder="0.00" class="form-control">
                        </div>
                    </div>
                </div>
        </fieldset>
        <fieldset>
                <div class="row g-5 pb-3">
                    <div class="col-md">
                        <label for="FirstName" class="form-label fs-6">First Name</label>
                        <input type="text" id="FirstName" class="form-control">
                    </div>
                    <div class="col">
                        <label for="LastName" class="form-label fs-6">Last Name</label>
                        <input type="text" id="LastName" class="form-control">
                    </div>
                </div>
        </fieldset>
        <fieldset>
                <div class="row g-5 pb-3">
                    <div class="col-md-5">
                        <label for="city" class="form-label fs-6">City</label>
                        <input type="text" id="city" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label for="state" class="form-label fs-6">State</label>
                        <select id="state" class="form-select">
                            <option value="">Pick a state</option>
  <option value="AL">AL</option>
  <option value="AK">AK</option>
  <option value="AZ">AZ</option>
  <option value="AR">AR</option>
  <option value="CA">CA</option>
  <option value="CO">CO</option>
  <option value="CT">CT</option>
  <option value="DE">DE</option>
  <option value="FL">FL</option>
  <option value="GA">GA</option>
  <option value="HI">HI</option>
  <option value="ID">ID</option>
  <option value="IL">IL</option>
  <option value="IN">IN</option>
  <option value="IA">IA</option>
  <option value="KS">KS</option>
  <option value="KY">KY</option>
  <option value="LA">LA</option>
  <option value="ME">ME</option>
  <option value="MD">MD</option>
  <option value="MA">MA</option>
  <option value="MI">MI</option>
  <option value="MN">MN</option>
  <option value="MS">MS</option>
  <option value="MO">MO</option>
  <option value="MT">MT</option>
  <option value="NE">NE</option>
  <option value="NV">NV</option>
  <option value="NH">NH</option>
  <option value="NJ">NJ</option>
  <option value="NM">NM</option>
  <option value="NY">NY</option>
  <option value="NC">NC</option>
  <option value="ND">ND</option>
  <option value="OH">OH</option>
  <option value="OK">OK</option>
  <option value="OR">OR</option>
  <option value="PA">PA</option>
  <option value="RI">RI</option>
  <option value="SC">SC</option>
  <option value="SD">SD</option>
  <option value="TN">TN</option>
  <option value="TX">TX</option>
  <option value="UT">UT</option>
  <option value="VT">VT</option>
  <option value="VA">VA</option>
  <option value="WA">WA</option>
  <option value="WV">WV</option>
  <option value="WI">WI</option>
  <option value="WY">WY</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="PostalCode" class="form-label fs-6">Postal Code</label>
                        <input type="number" id="PostalCode" class="form-control">
                    </div>
                </div>
        </fieldset>
            <div class="row g-3 pb-4">
                <div class="col">
                        <p class="mb-3">We accept:</p>
                    <div class="bg-secondary rounded d-inline flex p-2">
                    <input type="radio" id="mastercard" name="cardType" autocomplete="off">
                        <label for="mastercard">
                            <i class="fa-brands fa-cc-mastercard"></i>
                        </label>
                    <input type="radio" id="visa" name="cardType" autocomplete="off">
                        <label for="visa">
                            <i class="fa-brands fa-cc-visa"></i>
                        </label>
                    <input type="radio" id="cc" name="cardType" autocomplete="off">
                        <label for="cc">
                            <i class="fa-brands fa-cc-diners-club"></i>
                        </label>
                    <input type="radio" id="discover" name="cardType" autocomplete="off">
                        <label for="discover">
                            <i class="fa-brands fa-cc-discover"></i>
                        </label>
                    </div>
                </div>
                    <div class="col">
                            <label for="message" class="form-label fs-6">Message</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Enter message here....."></textarea>
                    <div class="form-text">Add any notes here.</div>
                </div>
            </div>
            </div>
            <div class="card-footer p-auto d-flex">
                <button type="button" class="btn btn-secondary ms-auto">Cancel</button>
                <button type="button" class="btn btn-primary ms-3">Send</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
